name: CI - Integración Continua LoginApp

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-ci:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Descargar dependencias
        run: flutter pub get

      - name: 🔍 Analizar código (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Ejecutar pruebas unitarias (flutter test)
        run: flutter test

      - name: 📋 Confirmar estado exitoso
        if: success()
        run: echo "✅ Todas las pruebas de Flutter y el análisis estático pasaron exitosamente."
